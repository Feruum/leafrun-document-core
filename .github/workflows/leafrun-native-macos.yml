name: Leafrun standalone release rehearsal
on:
  push:
    branches: [ci/lea-6-macos-mr-21]
permissions:
  contents: read
jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Fetch the exact public review harness
        shell: bash
        run: |
          set -euo pipefail
          git init -q harness
          git -C harness fetch -q --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C harness checkout -q --detach "$GITHUB_SHA"
      - name: Verify standalone Core and render the invoice
        shell: pwsh
        run: ./harness/qualification/run.ps1

